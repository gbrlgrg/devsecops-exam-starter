name: CI Pipeline

# ---------------------------------------------------------------
# TRIGGER: Run this workflow on every push and pull request
# targeting the main branch.
# ---------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # STEP 1: Check out the repository code
      # This clones your repo into the GitHub Actions runner so all
      # subsequent steps can access your files.
      # ---------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # STEP 2: Set up Node.js
      # Installs Node.js 18 on the runner. We pin to version 18 to
      # match the version used in our Dockerfile for consistency.
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'  # Caches the npm dependency cache for faster runs

      # ---------------------------------------------------------------
      # STEP 3: Install dependencies
      # `npm ci` is preferred over `npm install` in CI environments
      # because it does a clean install strictly from package-lock.json,
      # ensuring deterministic and reproducible builds.
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------
      # STEP 4: Run automated tests
      # Executes the Jest test suite. If any test fails, the entire
      # workflow fails — preventing broken code from being merged.
      # ---------------------------------------------------------------
      - name: Run tests
        run: npm test

      # ---------------------------------------------------------------
      # STEP 5: Build Docker image
      # Builds the Docker image to verify the Dockerfile is valid and
      # the application can be successfully containerized.
      # We tag it with the Git commit SHA for traceability.
      # ---------------------------------------------------------------
      - name: Build Docker image
        run: docker build -t macky-merch-api:${{ github.sha }} .

      # ---------------------------------------------------------------
      # STEP 6: npm audit — Dependency vulnerability scan
      # Runs Node's built-in audit tool to check all installed packages
      # against the npm advisory database. `--audit-level=moderate`
      # flags anything moderate severity or above.
      # `|| true` ensures the workflow continues so we can also run
      # Trivy and capture all findings — remove it in production if
      # you want the pipeline to hard-fail on vulnerabilities.
      # ---------------------------------------------------------------
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      # ---------------------------------------------------------------
      # STEP 7: Trivy — Filesystem vulnerability scan
      # Scans the project directory (package.json / package-lock.json)
      # for dependencies with known CVEs. Trivy pulls its own
      # vulnerability database and reports findings in a table.
      # ---------------------------------------------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'   # Don't fail — let us capture the output

      # ---------------------------------------------------------------
      # STEP 8: Trivy — Docker image vulnerability scan
      # Scans the Docker image we just built for OS-level and
      # application-level vulnerabilities. This catches issues in
      # both the Alpine base image and our npm packages.
      # ---------------------------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'macky-merch-api:${{ github.sha }}'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'   # Don't fail — let us capture the output
